<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <title>StudyBuddy Lite</title>

  <!-- Google Font: Hindi-friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* =========================
       GLOBAL STYLES
    ========================== */
    :root {
      --purple: #7c3aed;
      --purple-dark: #5b21b6;
      --pink: #ec4899;
      --yellow: #fbbf24;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --ink: #202034;
      --muted: #6b7280;
      --card: rgba(255,255,255,.94);
      --bg: #f5f3ff;
      --shadow: 0 15px 40px rgba(76,29,149,.14);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans Devanagari", "Poppins", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(236,72,153,.18), transparent 25%),
        radial-gradient(circle at 90% 15%, rgba(59,130,246,.18), transparent 25%),
        radial-gradient(circle at 50% 100%, rgba(124,58,237,.15), transparent 30%),
        var(--bg);
      overflow-x: hidden;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .18;
      pointer-events: none;
      z-index: 0;
    }

    .blob.one {
      width: 180px;
      height: 180px;
      background: var(--pink);
      top: -70px;
      left: -70px;
    }

    .blob.two {
      width: 230px;
      height: 230px;
      background: var(--blue);
      right: -100px;
      bottom: 10%;
    }

    .screen {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 40px;
      position: relative;
      z-index: 1;
      animation: screenIn .35s ease;
    }

    .hidden {
      display: none !important;
    }

    @keyframes screenIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================
       HEADER
    ========================== */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
    }

    .mini-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 900;
      font-family: "Poppins", "Noto Sans Devanagari", sans-serif;
      font-size: 16px;
    }

    .logo-dot {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 8px 20px rgba(124,58,237,.28);
    }

    .language-switcher {
      display: inline-flex;
      padding: 4px;
      gap: 3px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(124,58,237,.1);
      border-radius: 999px;
      box-shadow: 0 5px 18px rgba(0,0,0,.06);
      backdrop-filter: blur(12px);
    }

    .lang-btn {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      font-weight: 800;
      transition: .2s ease;
    }

    .lang-btn.active {
      color: white;
      background: var(--purple);
      box-shadow: 0 4px 12px rgba(124,58,237,.25);
    }

    /* =========================
       HOME SCREEN
    ========================== */
    .hero {
      text-align: center;
      padding: 20px 0 25px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 15px;
      animation: floaty 3s ease-in-out infinite;
    }

    @keyframes floaty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .hero h1 {
      margin: 0;
      font-family: "Poppins", "Noto Sans Devanagari", sans-serif;
      font-size: clamp(38px, 10vw, 72px);
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--purple), var(--pink), var(--orange));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      margin: 14px auto 0;
      max-width: 570px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .setup-card,
    .badges-card,
    .quiz-card,
    .results-card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
    }

    .setup-card {
      padding: 20px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-of-type {
      margin-bottom: 22px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .select-wrap {
      position: relative;
    }

    .select-wrap::after {
      content: "⌄";
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-55%);
      color: var(--purple);
      font-weight: 900;
      pointer-events: none;
    }

    select {
      appearance: none;
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: 2px solid #eee8ff;
      border-radius: 17px;
      background: #faf9ff;
      color: var(--ink);
      font-weight: 700;
      outline: none;
      transition: .2s ease;
    }

    select:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 4px rgba(124,58,237,.1);
    }

    .primary-btn {
      width: 100%;
      min-height: 54px;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, var(--purple), var(--pink));
      box-shadow: 0 12px 25px rgba(124,58,237,.25);
      font-weight: 900;
      font-size: 16px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(124,58,237,.3);
    }

    .primary-btn:active,
    .secondary-btn:active,
    .option-btn:active {
      transform: scale(.97);
    }

    .badges-card {
      margin-top: 18px;
      padding: 20px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
    }

    .badge-count {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3e8ff;
      color: var(--purple-dark);
      font-size: 11px;
      font-weight: 900;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .badge-item {
      min-height: 100px;
      padding: 13px 10px;
      text-align: center;
      border-radius: 18px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      opacity: .42;
      filter: grayscale(1);
      transition: .25s ease;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: none;
      background: linear-gradient(135deg, #fff7ed, #fdf4ff);
      border-color: #f3e8ff;
      animation: badgePop .5s ease;
    }

    @keyframes badgePop {
      0% { transform: scale(.85); }
      70% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .badge-icon {
      font-size: 30px;
      display: block;
      margin-bottom: 5px;
    }

    .badge-name {
      font-size: 11px;
      font-weight: 800;
      line-height: 1.4;
    }

    .locked-text {
      font-size: 9px;
      color: #9ca3af;
      margin-top: 3px;
    }

    /* =========================
       QUIZ SCREEN
    ========================== */
    .quiz-top {
      margin-bottom: 18px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .quiz-number {
      font-size: 14px;
      font-weight: 900;
    }

    .streak {
      padding: 7px 11px;
      background: #fff7ed;
      color: #c2410c;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      animation: streakPulse .7s ease;
    }

    @keyframes streakPulse {
      0% { transform: scale(.8); }
      60% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .progress-track {
      width: 100%;
      height: 9px;
      background: #e9e5f8;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--purple), var(--pink), var(--orange));
      transition: width .4s ease;
    }

    .quiz-card {
      padding: 22px;
    }

    .topic-pill {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: var(--purple-dark);
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .question {
      margin: 0 0 20px;
      font-size: clamp(21px, 5.5vw, 31px);
      line-height: 1.45;
      font-weight: 900;
    }

    .options {
      display: grid;
      gap: 11px;
    }

    .option-btn {
      width: 100%;
      min-height: 56px;
      padding: 12px 15px;
      border: 2px solid #ebe7f5;
      border-radius: 17px;
      background: white;
      color: var(--ink);
      text-align: left;
      font-weight: 800;
      transition: .18s ease;
    }

    .option-btn:hover {
      border-color: #c4b5fd;
      background: #faf8ff;
      transform: translateY(-1px);
    }

    .option-btn.correct {
      border-color: var(--green);
      background: #f0fdf4;
      color: #15803d;
      animation: correctBounce .45s ease;
    }

    .option-btn.wrong {
      border-color: var(--red);
      background: #fef2f2;
      color: #b91c1c;
      animation: shake .4s ease;
    }

    .option-btn:disabled {
      cursor: default;
    }

    @keyframes correctBounce {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.025); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
    }

    .feedback {
      margin-top: 17px;
      padding: 16px;
      border-radius: 18px;
      animation: screenIn .3s ease;
    }

    .feedback.correct-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
    }

    .feedback.wrong-box {
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .feedback-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .feedback p {
      margin: 5px 0;
      font-size: 13px;
      line-height: 1.65;
    }

    .feedback strong {
      color: var(--purple-dark);
    }

    .quiz-actions {
      display: flex;
      gap: 9px;
      margin-top: 16px;
    }

    .secondary-btn {
      flex: 1;
      min-height: 48px;
      border-radius: 15px;
      background: #f3f0ff;
      color: var(--purple-dark);
      font-weight: 900;
      transition: .15s ease;
    }

    .next-btn {
      flex: 1.5;
      min-height: 48px;
      border-radius: 15px;
      color: white;
      background: var(--purple);
      font-weight: 900;
      transition: .15s ease;
    }

    .secondary-btn:hover,
    .next-btn:hover {
      transform: translateY(-2px);
    }

    .streak-message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 13px;
      text-align: center;
      background: linear-gradient(135deg, #fff7ed, #fffbeb);
      color: #c2410c;
      font-weight: 900;
      font-size: 13px;
      animation: badgePop .4s ease;
    }

    /* =========================
       RESULTS
    ========================== */
    .results-wrap {
      text-align: center;
      padding-top: 30px;
    }

    .result-emoji {
      font-size: 62px;
      animation: resultPop .7s ease;
    }

    @keyframes resultPop {
      0% { transform: scale(.3) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.15) rotate(8deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .results-card {
      padding: 28px 20px;
    }

    .results-card h1 {
      margin: 7px 0 4px;
      font-size: 28px;
      font-weight: 900;
    }

    .score {
      font-size: 24px;
      font-weight: 900;
      color: var(--purple);
      margin: 12px 0;
    }

    .stars {
      font-size: 34px;
      letter-spacing: 3px;
      margin: 8px 0 15px;
    }

    .result-message {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 auto 22px;
      max-width: 500px;
    }

    .new-badges {
      margin: 20px 0;
      padding: 15px;
      background: #faf5ff;
      border-radius: 18px;
      border: 1px solid #e9d5ff;
    }

    .new-badges h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .new-badge-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .new-badge {
      padding: 9px 12px;
      border-radius: 14px;
      background: white;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 5px 15px rgba(124,58,237,.1);
      animation: badgePop .55s ease both;
    }

    .result-buttons {
      display: grid;
      gap: 10px;
    }

    /* =========================
       CONFETTI
    ========================== */
    #confetti-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 100;
    }

    .confetti {
      position: absolute;
      top: -20px;
      width: 9px;
      height: 14px;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (min-width: 650px) {
      .screen {
        padding: 28px 24px 50px;
      }

      .setup-card,
      .badges-card,
      .quiz-card,
      .results-card {
        padding: 28px;
      }

      .badges-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .options {
        grid-template-columns: repeat(2, 1fr);
      }

      .result-buttons {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 360px) {
      .screen {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero h1 {
        font-size: 35px;
      }

      .setup-card,
      .quiz-card,
      .results-card {
        padding: 17px;
      }

      .badges-grid {
        gap: 7px;
      }

      .badge-item {
        padding: 10px 5px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="blob one"></div>
    <div class="blob two"></div>

    <div id="confetti-container"></div>

    <!-- =========================
         HOME SCREEN
    ========================== -->
    <main id="homeScreen" class="screen">
      <header class="topbar">
        <div class="mini-logo">
          <div class="logo-dot">SB</div>
          <span>StudyBuddy</span>
        </div>

        <div class="language-switcher" aria-label="Language">
          <button class="lang-btn" data-lang="hi">हिंदी</button>
          <button class="lang-btn" data-lang="en">English</button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-badge">✨ <span data-i18n="heroBadge"></span></div>
        <h1>StudyBuddy Lite</h1>
        <p data-i18n="heroText"></p>
      </section>

      <section class="setup-card">
        <div class="field">
          <label for="classSelect" data-i18n="selectClass"></label>
          <div class="select-wrap">
            <select id="classSelect">
              <option value="1">कक्षा 1</option>
              <option value="2">कक्षा 2</option>
              <option value="3" selected>कक्षा 3</option>
              <option value="4">कक्षा 4</option>
              <option value="5">कक्षा 5</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="subjectSelect" data-i18n="selectSubject"></label>
          <div class="select-wrap">
            <select id="subjectSelect">
              <option value="math" data-i18n="math"></option>
              <option value="english" data-i18n="english"></option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="topicSelect" data-i18n="selectTopic"></label>
          <div class="select-wrap">
            <select id="topicSelect"></select>
          </div>
        </div>

        <button id="startQuizBtn" class="primary-btn" data-i18n="startQuiz"></button>
      </section>

      <section class="badges-card">
        <div class="section-heading">
          <h2 data-i18n="badges"></h2>
          <span id="badgeCount" class="badge-count"></span>
        </div>
        <div id="badgesGrid" class="badges-grid"></div>
      </section>
    </main>

    <!-- =========================
         QUIZ SCREEN
    ========================== -->
    <main id="quizScreen" class="screen hidden">
      <header class="topbar">
        <div class="mini-logo">
          <div class="logo-dot">SB</div>
          <span>StudyBuddy</span>
        </div>

        <div class="language-switcher">
          <button class="lang-btn" data-lang="hi">हिंदी</button>
          <button class="lang-btn" data-lang="en">English</button>
        </div>
      </header>

      <section class="quiz-top">
        <div class="quiz-header">
          <span id="questionCounter" class="quiz-number"></span>
          <span id="streakDisplay" class="streak hidden"></span>
        </div>

        <div class="progress-track">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </section>

      <section class="quiz-card">
        <div id="topicPill" class="topic-pill"></div>
        <h2 id="questionText" class="question"></h2>

        <div id="optionsContainer" class="options"></div>

        <div id="feedback" class="feedback hidden"></div>

        <div id="streakMessage" class="streak-message hidden"></div>

        <div class="quiz-actions">
          <button id="hintBtn" class="secondary-btn"></button>
          <button id="nextBtn" class="next-btn hidden"></button>
        </div>

        <div id="hintBox" class="feedback hidden"></div>
      </section>
    </main>

    <!-- =========================
         RESULTS SCREEN
    ========================== -->
    <main id="resultsScreen" class="screen hidden">
      <header class="topbar">
        <div class="mini-logo">
          <div class="logo-dot">SB</div>
          <span>StudyBuddy</span>
        </div>

        <div class="language-switcher">
          <button class="lang-btn" data-lang="hi">हिंदी</button>
          <button class="lang-btn" data-lang="en">English</button>
        </div>
      </header>

      <section class="results-wrap">
        <div id="resultEmoji" class="result-emoji">🎉</div>

        <div class="results-card">
          <h1 data-i18n="quizComplete"></h1>
          <div id="scoreText" class="score"></div>
          <div id="stars" class="stars"></div>
          <p id="resultMessage" class="result-message"></p>

          <div id="newBadgesBox" class="new-badges hidden">
            <h3 data-i18n="newBadges"></h3>
            <div id="newBadgeList" class="new-badge-list"></div>
          </div>

          <div class="result-buttons">
            <button id="playAgainBtn" class="primary-btn" data-i18n="playAgain"></button>
            <button id="backHomeBtn" class="secondary-btn" data-i18n="backHome"></button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    /* =========================================================
       TRANSLATIONS
    ========================================================== */
    const translations = {
      hi: {
        appTitle: "StudyBuddy Lite",
        heroBadge: "सीखो • खेलो • लेवल अप करो",
        heroText: "कक्षा 1–5 के लिए मज़ेदार Math और English प्रैक्टिस। तैयार हो? चलो शुरू करते हैं! 🚀",
        selectClass: "कक्षा चुनें",
        selectSubject: "विषय चुनें",
        selectTopic: "टॉपिक चुनें",
        math: "गणित",
        english: "अंग्रेज़ी",
        startQuiz: "शुरू करें 🚀",
        badges: "बैज",

    ========================================================== */
    const homeScreen = document.getElementById("homeScreen");
    const quizScreen = document.getElementById("quizScreen");
    const resultsScreen = document.getElementById("resultsScreen");

    const classSelect = document.getElementById("classSelect");
    const subjectSelect = document.getElementById("subjectSelect");
    const topicSelect = document.getElementById("topicSelect");

    const startQuizBtn = document.getElementById("startQuizBtn");

    const questionCounter = document.getElementById("questionCounter");
    const progressFill = document.getElementById("progressFill");
    const streakDisplay = document.getElementById("streakDisplay");
    const topicPill = document.getElementById("topicPill");
    const questionText = document.getElementById("questionText");
    const optionsContainer = document.getElementById("optionsContainer");
    const feedback = document.getElementById("feedback");
    const hintBtn = document.getElementById("hintBtn");
    const hintBox = document.getElementById("hintBox");
    const nextBtn = document.getElementById("nextBtn");
    const streakMessage = document.getElementById("streakMessage");

    const scoreText = document.getElementById("scoreText");
    const stars = document.getElementById("stars");
    const resultMessage = document.getElementById("resultMessage");
    const resultEmoji = document.getElementById("resultEmoji");
    const newBadgesBox = document.getElementById("newBadgesBox");
    const newBadgeList = document.getElementById("newBadgeList");

    /* =========================================================
       UTILITY FUNCTIONS
    ========================================================== */
    function t(key) {
      return translations[language][key] || key;
    }

    function applyTranslations() {
      document.documentElement.lang = language === "hi" ? "hi" : "en";

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.dataset.i18n;
        element.textContent = t(key);
      });

      document.querySelectorAll(".lang-btn").forEach(button => {
        button.classList.toggle("active", button.dataset.lang === language);
      });

      updateTopicOptions();
      renderBadges();

      if (!quizScreen.classList.contains("hidden")) {
        renderQuestion();
      }

      if (!resultsScreen.classList.contains("hidden")) {
        renderResults();
      }
    }

    function switchLanguage(newLanguage) {
      language = newLanguage;
      localStorage.setItem("studybuddy_language", language);
      applyTranslations();
    }

    function showScreen(screen) {
      [homeScreen, quizScreen, resultsScreen].forEach(s => {
        s.classList.add("hidden");
      });

      screen.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    /* =========================================================
       TOPIC FILTERING
    ========================================================== */
    const topicNames = {
      math: {
        addition: { hi: "जोड़", en: "Addition" },
        subtraction: { hi: "घटाव", en: "Subtraction" },
        multiplication: { hi: "गुणा", en: "Multiplication" },
        "word-problem": { hi: "शब्द प्रश्न", en: "Word Problems" },
        mixed: { hi: "मिक्स", en: "Mixed" }
      },
      english: {
        spelling: { hi: "वर्तनी", en: "Spelling" },
        grammar: { hi: "व्याकरण", en: "Grammar" },
        vocabulary: { hi: "शब्दावली", en: "Vocabulary" }
      }
    };

    function updateTopicOptions() {
      const subject = subjectSelect.value;
      const selectedTopic = topicSelect.value;

      topicSelect.innerHTML = "";

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = t("topicAll");
      topicSelect.appendChild(allOption);

      Object.entries(topicNames[subject]).forEach(([key, name]) => {
        const option = document.createElement("option");
        option.value = key;
        option.textContent = name[language];
        topicSelect.appendChild(option);
      });

      if ([...topicSelect.options].some(o => o.value === selectedTopic)) {
        topicSelect.value = selectedTopic;
      } else {
        topicSelect.value = "all";
      }
    }

    /* =========================================================
       BADGE STORAGE
    ========================================================== */
    function getUnlockedBadges() {
      try {
        return JSON.parse(localStorage.getItem("studybuddy_badges") || "[]");
      } catch {
        return [];
      }
    }

    function saveBadge(badgeId) {
      const badges = getUnlockedBadges();

      if (!badges.includes(badgeId)) {
        badges.push(badgeId);
        localStorage.setItem("studybuddy_badges", JSON.stringify(badges));
        return true;
      }

      return false;
    }

    function renderBadges() {
      const unlocked = getUnlockedBadges();
      const grid = document.getElementById("badgesGrid");

      grid.innerHTML = "";

      badgeDefinitions.forEach(badge => {
        const item = document.createElement("div");

        const isUnlocked = unlocked.includes(badge.id);

        item.className = "badge-item" + (isUnlocked ? " unlocked" : "");

        item.innerHTML = `
          <span class="badge-icon">${badge.icon}</span>
          <div class="badge-name">${badge[language]}</div>
          ${!isUnlocked ? `<div class="locked-text">🔒 ${t("locked")}</div>` : ""}
        `;

        grid.appendChild(item);
      });

      document.getElementById("badgeCount").textContent =
        `${unlocked.length}/${badgeDefinitions.length}`;
    }

    /* =========================================================
       QUIZ SETUP
    ========================================================== */
    function startQuiz() {
      const classValue = Number(classSelect.value);
      const subjectValue = subjectSelect.value;
      const topicValue = topicSelect.value;

      currentSettings = {
        class: classValue,
        subject: subjectValue,
        topic: topicValue
      };

      /*
        Questions are selected from the chosen class or lower
        classes so younger/easier questions remain available.
        This also ensures every class can access enough content.
      */
      let pool = questions.filter(q =>
        q.subject === subjectValue &&
        q.class <= classValue &&
        (topicValue === "all" || q.topic === topicValue)
      );

      // If the exact topic has too few questions, use all subject questions.
      if (pool.length < 5) {
        pool = questions.filter(q =>
          q.subject === subjectValue &&
          q.class <= classValue
        );
      }

      quizQuestions = shuffle(pool).slice(0, Math.min(10, pool.length));

      // If somehow nothing matches, use a safe fallback.
      if (quizQuestions.length === 0) {
        quizQuestions = shuffle(
          questions.filter(q => q.subject === subjectValue)
        ).slice(0, 10);
      }

      currentQuestionIndex = 0;
      score = 0;
      streak = 0;
      selectedAnswer = null;
      quizAnswered = false;

      showScreen(quizScreen);
      renderQuestion();
    }

    /* =========================================================
       QUIZ RENDERING
    ========================================================== */
    function renderQuestion() {
      if (!quizQuestions.length) return;

      const q = quizQuestions[currentQuestionIndex];

      selectedAnswer = null;
      quizAnswered = false;

      questionCounter.textContent =
        `${t("question")} ${currentQuestionIndex + 1} ${t("of")} ${quizQuestions.length}`;

      progressFill.style.width =
        `${((currentQuestionIndex + 1) / quizQuestions.length) * 100}%`;

      const topicName =
        topicNames[q.subject]?.[q.topic]?.[language] ||
        (q.subject === "math" ? t("math") : t("english"));

      topicPill.textContent = topicName;

      questionText.textContent = q.question;

      optionsContainer.innerHTML = "";

      q.options.forEach(option => {
        const button = document.createElement("button");

        button.className = "option-btn";
        button.textContent = option;
        button.addEventListener("click", () => selectAnswer(option, button));

        optionsContainer.appendChild(button);
      });

      feedback.className = "feedback hidden";
      feedback.innerHTML = "";

      hintBox.className = "feedback hidden";
      hintBox.innerHTML = "";

      hintBtn.textContent = `💡 ${t("hint")}`;
      nextBtn.textContent =
        currentQuestionIndex === quizQuestions.length - 1
          ? `${t("quizComplete")} →`
          : t("next");

      nextBtn.classList.add("hidden");
      streakMessage.classList.add("hidden");

      updateStreakDisplay();
    }

    /* =========================================================
       ANSWER LOGIC
    ========================================================== */
    function selectAnswer(answer, clickedButton) {
      if (quizAnswered) return;

      quizAnswered = true;
      selectedAnswer = answer;

      const q = quizQuestions[currentQuestionIndex];
      const optionButtons = document.querySelectorAll(".option-btn");

      optionButtons.forEach(button => {
        button.disabled = true;

        if (button.textContent === q.answer) {
          button.classList.add("correct");
        }
      });

      if (answer === q.answer) {
        score++;
        streak++;

        clickedButton.classList.add("correct");

        feedback.className = "feedback correct-box";

        feedback.innerHTML = `
          <div class="feedback-title">${t("correct")}</div>
          <p>${q.explanation}</p>
        `;

        if (streak >= 3) {
          streakMessage.textContent =
            t("streakText").replace("{n}", streak);

          streakMessage.classList.remove("hidden");
          streakDisplay.classList.remove("hidden");
        }

        if (streak >= 3) {
          createConfetti(18);
        }
      } else {
        streak = 0;

        clickedButton.classList.add("wrong");

        feedback.className = "feedback wrong-box";

        feedback.innerHTML = `
          <div class="feedback-title">${t("wrong")}</div>
          <p><strong>${t("correctAnswer")}:</strong> ${q.answer}</p>
          <p><strong>${t("explanation")}:</strong> ${q.explanation}</p>
        `;
      }

      updateStreakDisplay();

      nextBtn.classList.remove("hidden");
    }

    function updateStreakDisplay() {
      if (streak >= 3) {
        streakDisplay.textContent =
          `🔥 ${t("streak")} ${streak}`;
        streakDisplay.classList.remove("hidden");
      } else {
        streakDisplay.classList.add("hidden");
      }
    }

    /* =========================================================
       HINT
    ========================================================== */
    function showHint() {
      const q = quizQuestions[currentQuestionIndex];

      if (hintBox.classList.contains("hidden")) {
        hintBox.className = "feedback";
        hintBox.style.background = "#eff6ff";
        hintBox.style.borderColor = "#bfdbfe";

        hintBox.innerHTML = `
          <div class="feedback-title">💡 ${t("hint")}</div>
          <p>${q.hint}</p>
        `;

        hintBtn.textContent = `💡 ${t("hideHint")}`;
      } else {
        hintBox.className = "feedback hidden";
        hintBox.innerHTML = "";
        hintBtn.textContent = `💡 ${t("hint")}`;
      }
    }

    /* =========================================================
       NEXT QUESTION
    ========================================================== */
    function nextQuestion() {
      if (!quizAnswered) return;

      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    /* =========================================================
       FINISH QUIZ + BADGES
    ========================================================== */
    function finishQuiz() {
      const newlyUnlocked = [];

      // First quiz badge.
      if (saveBadge("firstQuiz")) {
        newlyUnlocked.push("firstQuiz");
      }

      // 10 correct in one quiz.
      if (score === 10 && saveBadge("tenCorrect")) {
        newlyUnlocked.push("tenCorrect");
      }

      // Subject-specific mastery.
      if (
        currentSettings.subject === "math" &&
        score >= 8 &&
        saveBadge("mathMaster")
      ) {
        newlyUnlocked.push("mathMaster");
      }

      if (
        currentSettings.subject === "english" &&
        score >= 8 &&
        saveBadge("englishPro")
      ) {
        newlyUnlocked.push("englishPro");
      }

      renderResults(newlyUnlocked);

      showScreen(resultsScreen);

      if (score >= 8 || newlyUnlocked.length) {
        createConfetti(70);
      }
    }

    /* =========================================================
       RESULTS
    ========================================================== */
    function renderResults(newlyUnlocked = []) {
      const total = quizQuestions.length;

      scoreText.textContent =
        `${t("score")}: ${score} / ${total}`;

      if (score >= 9) {
        stars.textContent = "⭐⭐⭐";
        resultEmoji.textContent = "🏆";
        resultMessage.textContent = t("awesome");
      } else if (score >= 6) {
        stars.textContent = "⭐⭐";
        resultEmoji.textContent = "🌟";
        resultMessage.textContent = t("great");
      } else {
        stars.textContent = "⭐";
        resultEmoji.textContent = "💪";
        resultMessage.textContent = t("keepGoing");
      }

      newBadgeList.innerHTML = "";

      if (newlyUnlocked.length) {
        newBadgesBox.classList.remove("hidden");

        newlyUnlocked.forEach((id, index) => {
          const badge = badgeDefinitions.find(b => b.id === id);

          if (!badge) return;

          const element = document.createElement("div");

          element.className = "new-badge";
          element.style.animationDelay = `${index * .1}s`;
          element.textContent = `${badge.icon} ${badge[language]}`;

          newBadgeList.appendChild(element);
        });
      } else {
        newBadgesBox.classList.add("hidden");
      }
    }

    /* =========================================================
       CONFETTI
    ========================================================== */
    function createConfetti(amount = 50) {
      const container = document.getElementById("confetti-container");

      const symbols = ["●", "■", "◆", "★"];

      for (let i = 0; i < amount; i++) {
        const piece = document.createElement("div");

        piece.className = "confetti";

        piece.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        piece.style.left = `${Math.random() * 100}%`;
        piece.style.fontSize = `${8 + Math.random() * 10}px`;
        piece.style.opacity = `${.7 + Math.random() * .3}`;
        piece.style.animationDuration = `${1.8 + Math.random() * 2.2}s`;
        piece.style.animationDelay = `${Math.random() * .6}s`;

        // Use random HSL values instead of fixed colors.
        piece.style.color =
          `hsl(${Math.floor(Math.random() * 360)}, 85%, 55%)`;

        container.appendChild(piece);

        setTimeout(() => piece.remove(), 4500);
      }
    }

    /* =========================================================
       EVENT LISTENERS
    ========================================================== */
    document.querySelectorAll(".lang-btn").forEach(button => {
      button.addEventListener("click", () => {
        switchLanguage(button.dataset.lang);
      });
    });

    subjectSelect.addEventListener("change", updateTopicOptions);

    startQuizBtn.addEventListener("click", startQuiz);

    hintBtn.addEventListener("click", showHint);

    nextBtn.addEventListener("click", nextQuestion);

    document.getElementById("playAgainBtn").addEventListener("click", () => {
      startQuiz();
    });

    document.getElementById("backHomeBtn").addEventListener("click", () => {
      renderBadges();
      showScreen(homeScreen);
    });

    /* =========================================================
       OPTIONAL: SAVE LAST SETTINGS
    ========================================================== */
    function saveSettings() {
      localStorage.setItem(
        "studybuddy_settings",
        JSON.stringify({
          class: classSelect.value,
          subject: subjectSelect.value,
          topic: topicSelect.value
        })
      );
    }

    function loadSettings() {
      try {
        const saved = JSON.parse(
          localStorage.getItem("studybuddy_settings") || "null"
        );

        if (!saved) return;

        if ([...classSelect.options].some(o => o.value === saved.class)) {
          classSelect.value = saved.class;
        }

        if ([...subjectSelect.options].some(o => o.value === saved.subject)) {
          subjectSelect.value = saved.subject;
        }

        updateTopicOptions();

        if ([...topicSelect.options].some(o => o.value === saved.topic)) {
          topicSelect.value = saved.topic;
        }
      } catch {
        // Ignore malformed localStorage data.
      }
    }

    classSelect.addEventListener("change", saveSettings);
    subjectSelect.addEventListener("change", saveSettings);
    topicSelect.addEventListener("change", saveSettings);

    /* =========================================================
       INITIALIZE APP
    ========================================================== */
    loadSettings();
    updateTopicOptions();
    applyTranslations();
    renderBadges();
  </script>
</body>
</html>
